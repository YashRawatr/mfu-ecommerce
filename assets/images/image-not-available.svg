<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#161622" />
      <stop offset="55%" stop-color="#0b0b10" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Luxury Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>

    <!-- Platinum Gradient -->
    <linearGradient id="platGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Outer Architectural Framing Grid -->
  <rect x="28" y="28" width="744" height="944" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="rgba(212,175,55,0.18)" stroke-width="1" stroke-dasharray="4 6" />

  <!-- Corner Ornamental Crosshairs -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.65">
    <!-- Top-Left -->
    <path d="M 32 48 L 48 48 M 48 32 L 48 48" />
    <!-- Top-Right -->
    <path d="M 768 48 L 752 48 M 752 32 L 752 48" />
    <!-- Bottom-Left -->
    <path d="M 32 952 L 48 952 M 48 968 L 48 952" />
    <!-- Bottom-Right -->
    <path d="M 768 952 L 752 952 M 752 968 L 752 952" />
  </g>

  <!-- Ambient Center Glow Circle -->
  <circle cx="400" cy="460" r="160" fill="rgba(212,175,55,0.03)" filter="url(#softGlow)" />
  <circle cx="400" cy="460" r="110" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

  <!-- Archival Emblem / Camera Vault Icon -->
  <g transform="translate(400, 440)" text-anchor="middle">
    <!-- Diamond Frame -->
    <polygon points="0,-68 68,0 0,68 -68,0" fill="rgba(18,18,26,0.85)" stroke="url(#goldGrad)" stroke-width="1" opacity="0.8" />
    
    <!-- Minimalist Lens / Shutter Icon -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#f5d77f" stroke-width="1.5" opacity="0.85" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="6" fill="url(#goldGrad)" />
    
    <!-- Optical Aperture Blades -->
    <line x1="-12" y1="-24" x2="-2" y2="-12" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="24" y1="-12" x2="12" y2="-2" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="12" y1="24" x2="2" y2="12" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="-24" y1="12" x2="-12" y2="2" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  </g>

  <!-- Top Header Label -->
  <text x="400" y="110" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.32em" fill="#d4af37" text-transform="uppercase">
    MY FUNKO UNIVERSE &bull; ARCHIVAL VAULT
  </text>
  <line x1="280" y1="130" x2="520" y2="130" stroke="url(#platGrad)" stroke-width="1" />

  <!-- Primary Headline -->
  <text x="400" y="590" text-anchor="middle" font-family="'Didot', 'Playfair Display', Georgia, serif" font-size="28" font-weight="400" letter-spacing="0.12em" fill="#f8fafc">
    IMAGE NOT AVAILABLE
  </text>

  <!-- Subtitle -->
  <text x="400" y="635" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="500" letter-spacing="0.24em" fill="#94a3b8" text-transform="uppercase">
    OFFICIAL PHOTOGRAPHY IN ARCHIVAL PROCESS
  </text>

  <!-- Divider Line -->
  <line x1="330" y1="675" x2="470" y2="675" stroke="rgba(212,175,55,0.3)" stroke-width="1" />

  <!-- Trust Badges -->
  <g transform="translate(400, 720)" text-anchor="middle">
    <rect x="-170" y="0" width="340" height="34" rx="17" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="-135" cy="17" r="4" fill="#4ade80" />
    <text x="5" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.14em" fill="#e2e8f0" text-transform="uppercase">
      100% AUTHENTIC &bull; 10/10 MINT BOX SEALED
    </text>
  </g>

  <!-- Bottom Footnote -->
  <text x="400" y="890" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="400" letter-spacing="0.18em" fill="#64748b" text-transform="uppercase">
    INSPECTED BY MFU CURATION DESK &bull; UV SHIELD PROTECTED
  </text>
</svg>
