<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMando" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24"/>
      <stop offset="100%" stop-color="#0F1012"/>
    </linearGradient>
    <linearGradient id="beskar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
    <linearGradient id="groguSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="#F0EEE9"/>
  <rect x="70" y="50" width="660" height="900" rx="16" fill="#F7F6F2" stroke="#D8D4CC" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="70" y="50" width="660" height="130" rx="16" fill="#141413"/>
  <rect x="70" y="140" width="660" height="40" fill="#141413"/>
  <text x="110" y="125" font-family="'Impact', 'Arial Black', sans-serif" font-size="78" fill="#FFF" letter-spacing="2">POP!</text>
  <text x="280" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#38BDF8" letter-spacing="4">STAR WARS</text>
  <text x="280" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#A09E97" letter-spacing="2">THE MANDALORIAN</text>
  
  <!-- Box Number Badge -->
  <circle cx="660" cy="115" r="42" fill="#0284C7"/>
  <circle cx="660" cy="115" r="38" fill="none" stroke="#FFF" stroke-width="2"/>
  <text x="660" y="127" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" fill="#FFF" text-anchor="middle">402</text>

  <!-- Display Window Cutout -->
  <rect x="100" y="200" width="600" height="600" rx="20" fill="url(#bgMando)" stroke="#D8D4CC" stroke-width="3"/>
  <path d="M 120 220 L 680 220 L 580 780 L 120 780 Z" fill="white" opacity="0.03"/>

  <!-- Character: Mandalorian holding Grogu -->
  <g transform="translate(400, 510)">
    <!-- Shadow -->
    <ellipse cx="0" cy="220" rx="180" ry="24" fill="#000" opacity="0.45"/>
    
    <!-- Dark Cape -->
    <path d="M -110 80 L 110 80 L 140 220 L -140 220 Z" fill="#2E2825"/>

    <!-- Beskar Body Armor -->
    <rect x="-65" y="80" width="130" height="110" rx="10" fill="url(#beskar)"/>
    <rect x="-50" y="95" width="100" height="30" rx="6" fill="#4B5563"/>
    <rect x="-45" y="150" width="90" height="15" rx="4" fill="#6B4F3A"/>

    <!-- Legs & Greaves -->
    <rect x="-55" y="190" width="45" height="35" rx="6" fill="url(#beskar)"/>
    <rect x="10" y="190" width="45" height="35" rx="6" fill="url(#beskar)"/>

    <!-- Grogu (The Child) cradled in his arm -->
    <g transform="translate(65, 140)">
      <!-- Grogu Robe -->
      <path d="M -25 0 L 25 0 L 30 50 L -30 50 Z" fill="#C2A675"/>
      <!-- Grogu Ears -->
      <polygon points="-25,-25 -70,-20 -20,-10" fill="url(#groguSkin)"/>
      <polygon points="25,-25 70,-20 20,-10" fill="url(#groguSkin)"/>
      <!-- Grogu Head -->
      <ellipse cx="0" cy="-20" rx="30" ry="20" fill="url(#groguSkin)"/>
      <!-- Grogu Huge Eyes -->
      <circle cx="-12" cy="-20" r="8" fill="#141413"/>
      <circle cx="-10" cy="-22" r="2" fill="#FFF"/>
      <circle cx="12" cy="-20" r="8" fill="#141413"/>
      <circle cx="14" cy="-22" r="2" fill="#FFF"/>
    </g>

    <!-- Beskar Helmet (Oversized Funko Head) -->
    <rect x="-135" y="-190" width="270" height="240" rx="45" fill="url(#beskar)" stroke="#D1D5DB" stroke-width="2"/>
    
    <!-- Iconic T-Visor -->
    <path d="M -90 -65 L 90 -65 L 90 -45 L 20 -45 L 20 40 L -20 40 L -20 -45 L -90 -45 Z" fill="#0A0A0B"/>
    <!-- Center brow plate line -->
    <path d="M -100 -75 L 100 -75" stroke="#9CA3AF" stroke-width="3"/>
  </g>

  <!-- Official Lucasfilm / Bobblehead Sticker -->
  <g transform="translate(600, 700)">
    <circle cx="0" cy="0" r="46" fill="#0284C7" stroke="#FFF" stroke-width="3"/>
    <text x="0" y="-8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#FFF" text-anchor="middle" letter-spacing="1">LUCASFILM</text>
    <text x="0" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#FFF" text-anchor="middle">OFFICIAL</text>
  </g>

  <!-- Bottom Box Label Section -->
  <rect x="70" y="820" width="660" height="130" rx="16" fill="#F7F6F2"/>
  <text x="100" y="865" font-family="'Impact', 'Arial Black', sans-serif" font-size="36" fill="#141413" letter-spacing="1">THE MANDALORIAN WITH THE CHILD</text>
  <text x="100" y="895" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#63605A" letter-spacing="2">BOBBLE-HEAD / FIGURINE À TÊTE OSCILLANTE</text>
  <text x="100" y="920" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#2A4030" letter-spacing="1">THIS IS THE WAY &bull; 100% BESKAR EDITION</text>
</svg>

